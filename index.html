
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor Coopera</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>Medidor Coopera</h1>
        <p>Simule o consumo de energia da sua casa</p>
    </header>

    <main>
        <section class="card">
            <h2>Cadastrar aparelho</h2>

            <form id="form-aparelho">
                <label for="nome">Nome do aparelho</label>
                <input type="text" id="nome" required placeholder="Ex.: Geladeira">

                <label for="potencia">Potência (W)</label>
                <input type="number" id="potencia" min="1" max="10000" required>

                <label for="horas">Horas de uso por dia</label>
                <input type="number" id="horas" min="0" max="24" step="any" required>

                <label for="dias">Dias de uso no mês</label>
                <input type="number" id="dias" min="1" max="31" step="1" required>

                <button type="submit">Adicionar aparelho</button>
            </form>
        </section>

        <section class="card">
            <h2>Meus aparelhos</h2>

            <ul id="lista-aparelhos"></ul>

            <button type="button" id="btn-simular">
                Simular consumo
            </button>

            <p id="mensagem-erro"></p>
        </section>

        <section class="card" id="resultado">
            <h2>Resultado da simulação</h2>
            <p>Adicione seus aparelhos e clique em Simular consumo.</p>
        </section>
    </main>

    <footer>
        <p>Medidor Coopera | Energia consciente para todos</p>
    </footer>

</body>
</html>
